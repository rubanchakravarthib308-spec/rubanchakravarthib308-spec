<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111D"/>
      <stop offset="0.58" stop-color="#0A1725"/>
      <stop offset="1" stop-color="#101B2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="60" x2="1100" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- left identity block -->
  <text x="72" y="62" fill="#7F93A8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3.2">ENTERPRISE TECH → AI ENGINEERING</text>
  <text x="72" y="126" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800">Ruban Chakravarthi</text>
  <text x="72" y="170" fill="#A7B7C7" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600">Building reliable AI systems for real-world workflows.</text>
  <text x="72" y="212" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">Reason → Act → Verify → Earn Trust</text>
  <text x="72" y="262" fill="#71869A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Agentic AI  •  RAG Reliability  •  AI Ops  •  Automation  •  Human-in-the-loop</text>

  <!-- divider -->
  <line x1="650" y1="62" x2="650" y2="258" stroke="#173047" stroke-width="1"/>

  <!-- right: animated control loop -->
  <g transform="translate(915 158)">
    <circle r="98" stroke="#183247" stroke-width="2" fill="none"/>
    <circle r="98" stroke="url(#accent)" stroke-width="2" fill="none" stroke-dasharray="7 18" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- center core -->
    <circle r="39" fill="#0C2030" stroke="#38BDF8" stroke-opacity="0.45"/>
    <circle r="28" fill="#0E2636" stroke="#5EEAD4" stroke-opacity="0.55"/>
    <circle r="6" fill="#B8F7FF" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="58" text-anchor="middle" fill="#7E91A3" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">RELIABLE AI LOOP</text>

    <!-- node labels -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">
      <circle cx="0" cy="-98" r="8" fill="#5EEAD4" filter="url(#glow)"/>
      <text x="0" y="-118" text-anchor="middle" fill="#BDFDF5">REASON</text>

      <circle cx="98" cy="0" r="8" fill="#38BDF8" filter="url(#glow)"/>
      <text x="119" y="5" fill="#B9ECFF">ACT</text>

      <circle cx="0" cy="98" r="8" fill="#818CF8" filter="url(#glow)"/>
      <text x="0" y="126" text-anchor="middle" fill="#D1D5FF">VERIFY</text>

      <circle cx="-98" cy="0" r="8" fill="#A78BFA" filter="url(#glow)"/>
      <text x="-119" y="5" text-anchor="end" fill="#E0D1FF">TRUST</text>
    </g>

    <!-- animated data packets -->
    <circle r="3.2" fill="#E6FCFF" filter="url(#glow)">
      <animateMotion dur="5.8s" repeatCount="indefinite" path="M0,-98 A98,98 0 1,1 -0.1,-98"/>
    </circle>
    <circle r="2.8" fill="#C4B5FD" filter="url(#glow)">
      <animateMotion dur="5.8s" begin="2.9s" repeatCount="indefinite" path="M0,-98 A98,98 0 1,1 -0.1,-98"/>
    </circle>

    <!-- inner directional arcs -->
    <path d="M0 -58 C35 -55 55 -35 58 0" stroke="#2DD4BF" stroke-width="1.4" opacity="0.45" fill="none" stroke-dasharray="4 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M58 0 C55 35 35 55 0 58" stroke="#38BDF8" stroke-width="1.4" opacity="0.45" fill="none" stroke-dasharray="4 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 58 C-35 55 -55 35 -58 0" stroke="#818CF8" stroke-width="1.4" opacity="0.45" fill="none" stroke-dasharray="4 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M-58 0 C-55 -35 -35 -55 0 -58" stroke="#A78BFA" stroke-width="1.4" opacity="0.45" fill="none" stroke-dasharray="4 7">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- subtle corner signature -->
  <text x="1118" y="292" text-anchor="end" fill="#41576A" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">BUILD • VERIFY • IMPROVE</text>
</svg>

<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="accent" x1="110" y1="70" x2="960" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58E6D9"/>
      <stop offset="0.55" stop-color="#72A7FF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="nodeGlow">
      <stop offset="0" stop-color="#D9FBFF" stop-opacity="1"/>
      <stop offset="0.32" stop-color="#8BE9FD" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8BE9FD" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal"><rect x="112" y="195" width="0" height="45"><animate attributeName="width" values="0;690;690" keyTimes="0;0.22;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>

  <!-- subtle ambient sweep -->
  <rect x="560" y="0" width="150" height="360" fill="#4FD1C5" opacity="0">
    <animate attributeName="x" values="560;1160" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.025;0.025;0" keyTimes="0;0.25;0.75;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- agentic network -->
  <g stroke="#7DD3FC" stroke-width="1.2" fill="none">
    <g opacity="0.22">
      <path d="M760 54L860 102L944 74L1034 142L1120 110"/>
      <path d="M782 214L864 170L948 204L1034 166L1110 224"/>
      <path d="M816 292L888 252L982 278L1074 250"/>
      <path d="M860 102L864 170L888 252"/>
      <path d="M944 74L948 204L982 278"/>
      <path d="M1034 142L1034 166L1074 250"/>
    </g>
    <g opacity="0.55">
      <path d="M760 54L860 102L944 74L1034 142L1120 110" stroke-dasharray="4 18">
        <animate attributeName="stroke-dashoffset" values="0;-88" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M782 214L864 170L948 204L1034 166L1110 224" stroke-dasharray="3 20">
        <animate attributeName="stroke-dashoffset" values="0;-92" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- moving signals -->
  <circle r="3.2" fill="#D6FBFF" filter="url(#glow)">
    <animateMotion path="M760 54L860 102L944 74L1034 142L1120 110" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.8" fill="#A78BFA" filter="url(#glow)">
    <animateMotion path="M816 292L888 252L982 278L1074 250" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.22;0.88;1" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- pulsing nodes -->
  <g fill="#8BE9FD" filter="url(#glow)">
    <circle cx="760" cy="54" r="4"><animate attributeName="r" values="4;6;4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="102" r="5"><animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="944" cy="74" r="4"><animate attributeName="r" values="4;5.5;4" dur="4.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="1034" cy="142" r="5"><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="110" r="4"><animate attributeName="r" values="4;5.5;4" dur="5.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="782" cy="214" r="4"><animate attributeName="opacity" values="0.55;1;0.55" dur="4.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="864" cy="170" r="5"><animate attributeName="r" values="5;7;5" dur="4.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="948" cy="204" r="5"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1034" cy="166" r="4"><animate attributeName="r" values="4;5.5;4" dur="5s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="224" r="4"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="816" cy="292" r="4"><animate attributeName="r" values="4;5.5;4" dur="4.3s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="888" cy="252" r="5"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="982" cy="278" r="4"><animate attributeName="r" values="4;5.5;4" dur="5.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="1074" cy="250" r="5"><animate attributeName="opacity" values="0.65;1;0.65" dur="4.5s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- signature accent -->
  <rect x="74" y="70" width="8" height="218" rx="4" fill="url(#accent)">
    <animate attributeName="opacity" values="0.78;1;0.78" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- identity -->
  <text x="112" y="118" fill="#90A4B8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="3">ENTERPRISE TECH → AI ENGINEERING</text>
  <text x="112" y="184" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">Ruban Chakravarthi</text>
  <text x="112" y="230" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Building systems that reason. Act. Verify. Earn trust.</text>
  <text x="112" y="276" fill="#B7C6D6" font-family="Arial, Helvetica, sans-serif" font-size="18">Agentic AI  •  RAG reliability  •  AI Ops  •  automation  •  human-in-the-loop</text>

  <!-- animated underline -->
  <rect x="112" y="305" width="320" height="2" rx="1" fill="#27445F" opacity="0.8"/>
  <rect x="112" y="305" width="72" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="x" values="112;360;112" keyTimes="0;0.5;1" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="72;42;72" keyTimes="0;0.5;1" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <text x="828" y="320" fill="#7890A8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2">PLAN • RETRIEVE • VERIFY • APPROVE</text>
</svg>
